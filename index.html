<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>

    <!-- Balance Display -->
    <header id="header">
      <h1>Expense &amp; Budget Visualizer</h1>
      <p class="balance-label">Total Expenses</p>
      <p id="balance" aria-live="polite" aria-atomic="true">$0.00</p>
    </header>

    <main>

      <!-- Input Form -->
      <section id="transaction-form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>
        <form id="transaction-form" novalidate>

          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              maxlength="100"
              autocomplete="off"
              aria-label="Item name"
              aria-describedby="item-name-error"
              placeholder="e.g. Lunch"
            />
            <span id="item-name-error" class="field-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="0.01"
              max="999999999.99"
              step="0.01"
              aria-label="Amount in dollars"
              aria-describedby="amount-error"
              placeholder="e.g. 12.50"
            />
            <span id="amount-error" class="field-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select
              id="category"
              name="category"
              aria-label="Expense category"
            >
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <button type="submit">Add Transaction</button>

        </form>
      </section>

      <!-- Transaction List -->
      <section id="transaction-list-section" aria-labelledby="list-heading">
        <h2 id="list-heading">Transaction</h2>
        <ul
          id="transaction-list"
          aria-label="List of recorded expenses"
          aria-live="polite"
        >
          <li id="list-placeholder" class="placeholder">No expenses recorded yet.</li>
        </ul>
      </section>

      <!-- Chart -->
      <section id="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <div id="chart-container">
          <canvas
            id="expense-chart"
            aria-label="Pie chart of spending by category"
            role="img"
          ></canvas>
          <p id="chart-placeholder" class="placeholder">No spending data available.</p>
        </div>
      </section>

    </main>

    <!-- Toast / Error Banner -->
    <div
      id="toast"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      class="toast hidden"
    ></div>

    <!-- Chart.js 4.x via jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  </body>
</html>
